<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-14 -10 148 158">
  <defs>
    <linearGradient id="amFire" gradientUnits="userSpaceOnUse" x1="30" y1="18" x2="60" y2="60">
      <stop offset="0" stop-color="#FFC668"></stop><stop offset="1" stop-color="#E12E1C"></stop>
    </linearGradient>
    <linearGradient id="amWater" gradientUnits="userSpaceOnUse" x1="92" y1="22" x2="60" y2="60">
      <stop offset="0" stop-color="#7FDBF6"></stop><stop offset="1" stop-color="#0F62C8"></stop>
    </linearGradient>
    <linearGradient id="amEarth" gradientUnits="userSpaceOnUse" x1="94" y1="98" x2="60" y2="60">
      <stop offset="0" stop-color="#EBBE7C"></stop><stop offset="1" stop-color="#88521E"></stop>
    </linearGradient>
    <linearGradient id="amNature" gradientUnits="userSpaceOnUse" x1="26" y1="98" x2="60" y2="60">
      <stop offset="0" stop-color="#84EC78"></stop><stop offset="1" stop-color="#1C8A2C"></stop>
    </linearGradient>
    <linearGradient id="amRing" gradientUnits="userSpaceOnUse" x1="60" y1="4" x2="60" y2="116">
      <stop offset="0" stop-color="#FBFDFF"></stop><stop offset="0.5" stop-color="#C3CCDC"></stop><stop offset="1" stop-color="#7C879B"></stop>
    </linearGradient>
    <radialGradient id="amSpark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="gemShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"></feDropShadow>
    </filter>
  </defs>
  <g filter="url(#gemShadow)">
    <polygon points="60,8 8,60 60,60" fill="url(#amFire)"></polygon>
    <polygon points="60,8 112,60 60,60" fill="url(#amWater)"></polygon>
    <polygon points="112,60 60,112 60,60" fill="url(#amEarth)"></polygon>
    <polygon points="8,60 60,112 60,60" fill="url(#amNature)"></polygon>
    <g stroke="rgba(8,10,18,0.30)" stroke-width="1.4" stroke-linecap="round">
      <line x1="60" y1="8" x2="60" y2="112"></line><line x1="8" y1="60" x2="112" y2="60"></line>
    </g>
    <polygon points="60,8 112,60 60,112 8,60" fill="none" stroke="url(#amRing)" stroke-width="4" stroke-linejoin="round"></polygon>
    <circle cx="60" cy="60" r="8.5" fill="url(#amSpark)"></circle>
    <polygon points="60,52 64,60 60,68 56,60" fill="#FFFFFF" opacity="0.85"></polygon>
  </g>
